pace="preserve">│</text><text x="924" y="415.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="435.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="435.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="455.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="455.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="475.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="475.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="495.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="495.2" fill="#f0abfc" textLength="142.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">y  purge 30 zones</text><text x="924" y="495.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="515.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="515.2" fill="#6d5f8a" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">n  cancel</text><text x="924" y="515.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="535.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="535.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="555.2" fill="#c026d3" textLength="924" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└──────────────────────────────────────────────────────────────────────────────────