<text x="8.4" y="35.2" fill="#22d3ee" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">T</text><text x="16.8" y="35.2" fill="#7287f3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A</text><text x="25.2" y="35.2" fill="#b666f8" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">N</text><text x="33.6" y="35.2" fill="#e29afb" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">U</text><text x="42" y="35.2" fill="#ee83d4" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">K</text><text x="50.4" y="35.2" fill="#ec4899" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">I</text><text x="840" y="35.2" fill="#a855f7" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ▄▄▄   ▄▄▄</text><text x="8.4" y="55.2" fill="#a99bc4" textLength="201.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Cloudflare cache manager</text><text x="840" y="55.2" fill="#a855f7" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▐█████████▌</text><text x="840" y="75.2" fill="#a855f7" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▐█ •   • █▌</text><text x="840" y="95.2" fill="#a855f7" textLength="92.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">▐█   ᴥ   █▌</text><text x="840" y="115.2" fill="#a855f7" textLength="84" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> ▀▀▀▀▀▀▀▀▀</text><text x="8.4" y="175.2" fill="#c026d3" textLength="924" lengthAdjust="spacingAndGlyphs" xml:space="preserve">┌────────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text><text x="8.4" y="195.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="195.2" fill="#6d5f8a" textLength="210" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Credentials · step 1 of 2</text><text x="924" y="195.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="215.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="215.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="235.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="235.2" fill="#f5f3ff" textLength="294" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Your token is in the macOS Keychain</text><text x="924" y="235.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="255.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="255.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="275.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="275.2" fill="#a99bc4" textLength="882" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Tanuki handed your token to the macOS Keychain through the operating system's own tool. It is not written</text><text x="924" y="275.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="295.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="295.2" fill="#a99bc4" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">into any file Tanuki creates, and Tanuki never prints it.</text><text x="924" y="295.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="315.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="315.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="335.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="335.2" fill="#a99bc4" textLength="562.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Tanuki's configuration files and its index contain no token at all.</text><text x="924" y="335.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="355.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="355.2" fill="#a99bc4" textLength="646.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Only your logged-in account can read the item back out of the macOS Keychain.</text><text x="924" y="355.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="375.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="375.2" fill="#a99bc4" textLength="554.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Backing up or syncing Tanuki's directory copies no secret with it.</text><text x="924" y="375.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="395.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="395.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="415.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="415.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="435.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="435.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="455.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="455.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="475.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="475.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="495.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="495.2" fill="#f0abfc" textLength="126" lengthAdjust="spacingAndGlyphs" xml:space="preserve">enter  continue</text><text x="924" y="495.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="515.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="25.2" y="515.2" fill="#6d5f8a" textLength="58.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">q  quit</text><text x="924" y="515.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="535.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="924" y="535.2" fill="#c026d3" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">│</text><text x="8.4" y="555.2" fill="#c026d3" textLength="924" lengthAdjust="spacingAndGlyphs" xml:space="preserve">└────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text><text x="8.4" y="595.2" fill="#6d5f8a" textLength="319.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">enter continue · p passphrase · q quit</text><text x="840" y="595.2" fill="#6d5f8a" textLength="75.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">made with</text><text x="924" y="595.2" fill="#ec4899" textLength="8.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">♥</text>
